# monitoring/docker-compose.infra.yml — observability infrastructure stack.
#
# Contains: Jaeger (traces), Prometheus (metrics), Alertmanager (alerts), Grafana (UI)
# Does NOT contain any microservices — those live in datasource-compose.yml
#
# Start:    make monitoring-up
# Stop:     make monitoring-down
# Logs:     docker compose -f monitoring/docker-compose.infra.yml logs -f
#
# .env is auto-loaded from this directory (monitoring/.env)
#
# ── Port scheme (monitoring = 900x) ──────────────────────────────────────────
#   9000  Grafana UI
#   9001  Prometheus UI + API
#   9002  Alertmanager UI + API
#   9003  Jaeger UI
#   9004  Loki API
#   9005  Discord relay (internal proxy — alertmanager → Discord)
#   4317  OTLP gRPC  (standard wire protocol — services send traces here)
#   4318  OTLP HTTP  (standard wire protocol)

networks:
  banking-net:
    name: banking-net      # fixed name so services compose can join it
    driver: bridge

volumes:
  prometheus-data:
  grafana-data:
  alertmanager-data:
  loki-data:

services:

  # ──────────────────────────────────────────────────────────────────────────
  # Loki — log storage (like Prometheus but for logs)
  # API: http://localhost:9004
  # ──────────────────────────────────────────────────────────────────────────
  loki:
    image: grafana/loki:3.0.0
    container_name: banking-loki
    restart: unless-stopped
    ports:
      - "9004:3100"
    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    command: -config.file=/etc/loki/loki-config.yml
    networks:
      - banking-net

  # ──────────────────────────────────────────────────────────────────────────
  # Promtail — log collector (reads Docker container logs → ships to Loki)
  # Needs access to Docker socket to read container logs
  # ──────────────────────────────────────────────────────────────────────────
  promtail:
    image: grafana/promtail:3.0.0
    container_name: banking-promtail
    restart: unless-stopped
    user: root   # needed to read Docker socket on macOS Docker Desktop
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # MODE B: local log files written by "make run-*" targets
      - ../logs:/var/log/banking:ro
    command: -config.file=/etc/promtail/promtail-config.yml
    networks:
      - banking-net
    depends_on:
      - loki

  # ──────────────────────────────────────────────────────────────────────────
  # Jaeger — distributed tracing
  # UI:        http://localhost:9003
  # OTLP gRPC: localhost:4317  ← services send traces here (standard port, unchanged)
  # ──────────────────────────────────────────────────────────────────────────
  jaeger:
    image: jaegertracing/all-in-one:1.58
    container_name: banking-jaeger
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "9003:16686"   # Jaeger UI
      - "4317:4317"    # OTLP gRPC — standard port, services send traces here
      - "4318:4318"    # OTLP HTTP
    networks:
      - banking-net

  # ──────────────────────────────────────────────────────────────────────────
  # alertmanager-discord — translates Alertmanager webhook → Discord embed
  #
  # Uses public image — no local source code needed.
  # Set DISCORD_WEBHOOK_URL in monitoring/.env
  # ──────────────────────────────────────────────────────────────────────────
  alertmanager-discord:
    build:
      context: ./discord-relay   # pure Go — builds natively on arm64, amd64, Windows
    image: banking-discord-relay
    container_name: banking-alertmanager-discord
    restart: unless-stopped
    environment:
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL}
      GRAFANA_URL: ${GRAFANA_URL:-http://localhost:9000}
    ports:
      - "9005:9094"
    networks:
      - banking-net

  # ──────────────────────────────────────────────────────────────────────────
  # Alertmanager — alert routing, deduplication, silencing
  # UI:  http://localhost:9002
  # ──────────────────────────────────────────────────────────────────────────
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: banking-alertmanager
    restart: unless-stopped
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    ports:
      - "9002:9093"
    networks:
      - banking-net
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
      - "--web.listen-address=:9093"

  # ──────────────────────────────────────────────────────────────────────────
  # Prometheus — metrics scraping + alert rule evaluation
  # UI:     http://localhost:9001
  # Reload: POST http://localhost:9001/-/reload
  # ──────────────────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: banking-prometheus
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerting/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    ports:
      - "9001:9090"
    networks:
      - banking-net
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
      - "--storage.tsdb.retention.time=7d"
    depends_on:
      - alertmanager

  # ──────────────────────────────────────────────────────────────────────────
  # Grafana — dashboards, alerts UI, single pane of glass
  # UI:    http://localhost:9000
  # Login: admin / admin
  # ──────────────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.0
    container_name: banking-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: http://localhost:9000
      GF_UNIFIED_ALERTING_ENABLED: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
    ports:
      - "9000:3000"
    networks:
      - banking-net
    depends_on:
      - prometheus
