# platform/docker-compose.yml — shared platform services
#
# Contains: Redis (tokens, sessions, cache, rate limiting)
#           Flipt  (feature flags — optional, services gracefully skip if unreachable)
#           NATS   (async messaging — optional, wire in when adding notification-svc etc.)
#           Metabase (BI / data exploration)
#
# Start:    make platform-up
# Stop:     make platform-down
# Logs:     docker compose -f platform/docker-compose.yml logs -f
#
# .env is auto-loaded from platform/.env
#
# ── Port scheme (platform = 905x) ────────────────────────────────────────────
#   9050  Redis
#   9051  Flipt UI + REST API
#   9052  Flipt gRPC
#   9053  NATS client connections
#   9054  NATS HTTP dashboard
#   9055  Metabase UI

networks:
  banking-net:
    name: banking-net
    driver: bridge

volumes:
  redis-data:
  flipt-data:
  nats-data:
  metabase-data:

services:

  # ──────────────────────────────────────────────────────────────────────────
  # Redis 7 — token store, session cache, rate limiting
  # Used by: auth-svc (refresh tokens), all services (rate limit counters)
  # CLI:  redis-cli -p 9050 -a <password>
  # ──────────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: platform-redis
    restart: unless-stopped
    ports:
      - "9050:6379"
    command: >
      redis-server
      --appendonly yes
      --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    networks:
      - banking-net
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ──────────────────────────────────────────────────────────────────────────
  # Flipt — feature flags (optional per-service)
  # UI:   http://localhost:9051
  # gRPC: localhost:9052
  # REST: localhost:9051/api/v1
  #
  # Services opt-in by setting FLIPT_URL in their .env.
  # If FLIPT_URL is empty or Flipt is unreachable, pkg/featureflag returns defaults.
  # ──────────────────────────────────────────────────────────────────────────
  flipt:
    image: flipt/flipt:latest
    container_name: platform-flipt
    restart: unless-stopped
    ports:
      - "9051:8080"   # UI + REST API
      - "9052:9000"   # gRPC
    environment:
      FLIPT_DB_URL: "file:/var/opt/flipt/flipt.db"
      FLIPT_LOG_LEVEL: warn
    volumes:
      - flipt-data:/var/opt/flipt
    networks:
      - banking-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ──────────────────────────────────────────────────────────────────────────
  # NATS — async messaging between services
  # Client:    localhost:9053
  # Dashboard: http://localhost:9054
  #
  # Use when: account-svc publishes events → notification-svc consumes them
  # Wire in pkg/messaging when you add your first async consumer.
  # ──────────────────────────────────────────────────────────────────────────
  nats:
    image: nats:2-alpine
    container_name: platform-nats
    restart: unless-stopped
    ports:
      - "9053:4222"   # client connections
      - "9054:8222"   # HTTP dashboard
    command: ["-js", "-m", "8222"]   # -js enables JetStream (persistent messaging)
    volumes:
      - nats-data:/data
    networks:
      - banking-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ──────────────────────────────────────────────────────────────────────────
  # Metabase — data visualization & business intelligence
  # UI:   http://localhost:9055
  #
  # On first run, complete the setup wizard at http://localhost:9055/setup
  # Add datasource connections in Admin → Databases:
  #   • PostgreSQL: host=host.docker.internal port=5432 (banking_auth, banking_accounts)
  #   • MySQL:      host=host.docker.internal port=3306
  #   • MongoDB:    host=host.docker.internal port=27017
  #
  # App state is stored in an embedded H2 file (metabase-data volume).
  # For production, switch MB_DB_TYPE to postgres with a dedicated DB.
  # ──────────────────────────────────────────────────────────────────────────
  metabase:
    image: metabase/metabase:latest
    container_name: platform-metabase
    restart: unless-stopped
    ports:
      - "9055:3000"
    environment:
      MB_DB_TYPE: h2
      MB_DB_FILE: /metabase-data/metabase.db
      MB_SITE_NAME: ${METABASE_SITE_NAME:-Banking Platform}
      JAVA_OPTS: "-Xmx512m"
    volumes:
      - metabase-data:/metabase-data
    networks:
      - banking-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/api/health | grep -q '\"status\":\"ok\"'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
