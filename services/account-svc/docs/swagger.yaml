info:
  contact: {}
  description: Account CRUD, credit/debit, and balance operations for the banking
    platform.
  title: account-svc API
  version: "1.0"
paths:
  /accounts:
    get:
      description: List accounts, optionally filtered by customer ID
      parameters:
      - description: Filter by customer ID
        in: query
        name: customer_id
        type: string
      - description: Page number
        in: query
        name: page
        type: integer
      - description: Page size
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpx.Response-github_com_sanusi_banking_services_account-svc_internal_domain_dto_PaginatedAccountsResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.Response-any'
      security:
      - BearerAuth: []
      summary: List accounts
      tags:
      - accounts
    post:
      consumes:
      - application/json
      description: Create a new bank account for a customer
      parameters:
      - description: Account payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_sanusi_banking_services_account-svc_internal_domain_dto.CreateAccountRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/httpx.Response-github_com_sanusi_banking_services_account-svc_internal_domain_dto_AccountResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.Response-any'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.Response-any'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/httpx.Response-any'
      security:
      - BearerAuth: []
      summary: Create account
      tags:
      - accounts
  /accounts/{id}:
    get:
      description: Get account details by ID
      parameters:
      - description: Account ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpx.Response-github_com_sanusi_banking_services_account-svc_internal_domain_dto_AccountResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.Response-any'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpx.Response-any'
      security:
      - BearerAuth: []
      summary: Get account
      tags:
      - accounts
  /accounts/{id}/balance:
    get:
      description: Get the current balance for an account
      parameters:
      - description: Account ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpx.Response-github_com_sanusi_banking_services_account-svc_internal_domain_dto_BalanceResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.Response-any'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpx.Response-any'
      security:
      - BearerAuth: []
      summary: Get balance
      tags:
      - accounts
  /accounts/{id}/credit:
    post:
      consumes:
      - application/json
      description: Credit funds to an account (subject to banking operation hours)
      parameters:
      - description: Account ID
        in: path
        name: id
        required: true
        type: string
      - description: Credit payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_sanusi_banking_services_account-svc_internal_domain_dto.CreditRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpx.Response-github_com_sanusi_banking_services_account-svc_internal_domain_dto_AccountResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.Response-any'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpx.Response-any'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/httpx.Response-any'
      security:
      - BearerAuth: []
      summary: Credit account
      tags:
      - accounts
  /accounts/{id}/debit:
    post:
      consumes:
      - application/json
      description: Debit funds from an account (subject to banking operation hours)
      parameters:
      - description: Account ID
        in: path
        name: id
        required: true
        type: string
      - description: Debit payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_sanusi_banking_services_account-svc_internal_domain_dto.DebitRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpx.Response-github_com_sanusi_banking_services_account-svc_internal_domain_dto_AccountResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.Response-any'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpx.Response-any'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/httpx.Response-any'
      security:
      - BearerAuth: []
      summary: Debit account
      tags:
      - accounts
schemes:
- http
securityDefinitions:
  BearerAuth:
    description: Bearer JWT, e.g. "Bearer <token>"
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
