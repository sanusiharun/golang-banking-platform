# traefik/traefik.yml — Traefik v3 static configuration
#
# Uses file provider — no Docker socket needed (Windows Docker Desktop compatible).
# Routes are defined in traefik/dynamic.yml and hot-reloaded on change.
#
# Entrypoints:
#   web       → :80   (all public API traffic)
#   dashboard → :8080 (Traefik dashboard — dev only)

api:
  dashboard: true
  insecure: true        # dashboard at http://localhost:8080 — disable in production

ping: {}                # enables /ping health endpoint (used by Docker healthcheck)

entryPoints:
  web:
    address: ":80"

providers:
  file:
    filename: /etc/traefik/dynamic.yml
    watch: true         # hot-reload routes without restarting Traefik

log:
  level: INFO
  format: json

accessLog:
  format: json
  fields:
    headers:
      defaultMode: drop
      names:
        Authorization: redact    # never log auth tokens in plaintext
        X-Api-Key: redact
