# .golangci.yml — linter configuration for golang-banking-platform
# Run: make lint
# Docs: https://golangci-lint.run/usage/configuration/
#
# v2 config schema. Requires golangci-lint v2 (github.com/golangci/golangci-lint/v2/cmd/golangci-lint).

version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    # ── Correctness ────────────────────────────────────────────────────────────
    - errcheck        # unchecked errors (most important)
    - staticcheck     # static analysis
    - unused          # unused code
    - ineffassign     # ineffectual assignments
    - govet           # suspicious constructs

    # ── Style & maintainability ────────────────────────────────────────────────
    - misspell        # common misspellings
    - unconvert       # unnecessary type conversions
    - unparam         # unused function parameters
    - nakedret        # naked returns in long functions
    - noctx           # http requests without context

    # ── Security ───────────────────────────────────────────────────────────────
    - gosec           # security issues

    # ── Complexity ─────────────────────────────────────────────────────────────
    - cyclop          # cyclomatic complexity
    - gocognit        # cognitive complexity

    # ── Error handling ─────────────────────────────────────────────────────────
    - errorlint       # error wrapping issues

  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true

    govet:
      enable-all: true
      disable:
        - fieldalignment

    cyclop:
      max-complexity: 15

    gocognit:
      min-complexity: 20

    gosec:
      excludes:
        - G401
        - G501
        - G304
        - G118 # fire-and-forget goroutines intentionally use context.Background() -- see CLAUDE.md's documented audit-publish pattern
        - G101 # false positive on domain constant names containing "token"/"credential" substrings, not actual secrets
        - G404 # math/rand is fine for backoff jitter; not used for anything security-sensitive

    nakedret:
      max-func-lines: 30

  exclusions:
    rules:
      - path: "_test\\.go"
        linters:
          - errcheck
          - gosec
          - unparam
          - cyclop    # table-driven tests naturally branch a lot; complexity here is enumeration, not control-flow risk
          - gocognit

      - path: "\\.pb\\.go"
        linters:
          - all

      - path: "migrations/"
        linters:
          - gosec

formatters:
  enable:
    - gofmt           # formatting
    - goimports       # import ordering

issues:
  max-issues-per-linter: 50
  max-same-issues: 10
