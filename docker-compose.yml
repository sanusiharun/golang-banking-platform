# docker-compose.yml — microservices stack + Traefik API gateway
#
# Requires:  make datasource-up + make platform-up first
#
# Start:     make services-up
# Rebuild:   make services-rebuild
# Stop:      make services-down
# Logs:      make services-logs
#
# Gateway:   http://localhost/         (all API traffic)
# Dashboard: http://localhost:8080/    (Traefik dashboard — dev only)
#
# Route map (defined in traefik/dynamic.yml):
#   /auth          → auth-svc:8082
#   /internal      → auth-svc:8082   (service-account admin endpoints)
#   /v1/accounts   → account-svc:8081
#   /debug         → account-svc:8081
#   /v1/audit      → audit-svc:8083
#   /v1/notifications
#   /v1/templates  → notification-svc:8084
#   /v1/schedules
#   /v1/payments   → payment-svc:8085

networks:
  banking-net:
    external: true
  datasource_datasource_net:
    external: true

services:

  # ──────────────────────────────────────────────────────────────────────────
  # traefik — API gateway + reverse proxy (port 80 HTTP, port 8080 dashboard)
  # Uses file provider — no Docker socket needed (Windows compatible).
  # Routes defined in traefik/dynamic.yml, hot-reloaded on change.
  # ──────────────────────────────────────────────────────────────────────────
  traefik:
    image: traefik:v3.1
    container_name: banking-traefik
    restart: unless-stopped
    networks:
      - banking-net
    ports:
      - "80:80"       # public HTTP entrypoint
      - "8080:8080"   # Traefik dashboard (dev only)
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ──────────────────────────────────────────────────────────────────────────
  # auth-svc — RS256 JWT issuance (port 8082)
  # ──────────────────────────────────────────────────────────────────────────
  auth-svc:
    build:
      context: .
      dockerfile: services/auth-svc/Dockerfile
    container_name: banking-auth-svc
    restart: unless-stopped
    networks:
      - banking-net
      - datasource_datasource_net
    env_file:
      - services/auth-svc/.env
    environment:
      # Docker overrides — service .env uses localhost for local dev
      DB_HOST: ds_postgres
      NATS_URL: nats://platform-nats:4222
      OTEL_EXPORTER_OTLP_ENDPOINT: banking-jaeger:4317
      REDIS_ADDR: platform-redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      FLIPT_URL: http://platform-flipt:8080
    ports:
      - "8082:8082"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/healthz/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ──────────────────────────────────────────────────────────────────────────
  # account-svc — account management, JWT verification (port 8081)
  # ──────────────────────────────────────────────────────────────────────────
  account-svc:
    build:
      context: .
      dockerfile: services/account-svc/Dockerfile
    container_name: banking-account-svc
    restart: unless-stopped
    networks:
      - banking-net
      - datasource_datasource_net
    depends_on:
      auth-svc:
        condition: service_started
    env_file:
      - services/account-svc/.env
    environment:
      # Docker overrides — service .env uses localhost for local dev
      DB_HOST: ds_postgres
      NATS_URL: nats://platform-nats:4222
      OTEL_EXPORTER_OTLP_ENDPOINT: banking-jaeger:4317
      AUTH_SVC_URL: http://banking-auth-svc:8082
      FLIPT_URL: http://platform-flipt:8080
      REDIS_ADDR: platform-redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/healthz/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ──────────────────────────────────────────────────────────────────────────
  # notification-svc — centralised notification platform (port 8084)
  # ──────────────────────────────────────────────────────────────────────────
  notification-svc:
    build:
      context: .
      dockerfile: services/notification-svc/Dockerfile
    container_name: banking-notification-svc
    restart: unless-stopped
    networks:
      - banking-net
      - datasource_datasource_net
    depends_on:
      auth-svc:
        condition: service_started
    env_file:
      - services/notification-svc/.env
    environment:
      DB_HOST: ds_postgres
      NATS_URL: nats://platform-nats:4222
      OTEL_EXPORTER_OTLP_ENDPOINT: banking-jaeger:4317
    ports:
      - "8084:8084"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8084/healthz/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ──────────────────────────────────────────────────────────────────────────
  # payment-svc — transaction orchestration (port 8085)
  # ──────────────────────────────────────────────────────────────────────────
  payment-svc:
    build:
      context: .
      dockerfile: services/payment-svc/Dockerfile
    container_name: banking-payment-svc
    restart: unless-stopped
    networks:
      - banking-net
      - datasource_datasource_net
    depends_on:
      auth-svc:
        condition: service_started
      account-svc:
        condition: service_started
    env_file:
      - services/payment-svc/.env
    environment:
      DB_HOST: ds_postgres
      NATS_URL: nats://platform-nats:4222
      OTEL_EXPORTER_OTLP_ENDPOINT: banking-jaeger:4317
      REDIS_ADDR: platform-redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      ACCOUNT_SVC_URL: http://banking-account-svc:8081
    ports:
      - "8085:8085"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8085/healthz/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ──────────────────────────────────────────────────────────────────────────
  # audit-svc — NATS consumer + audit log query API (port 8083)
  # ──────────────────────────────────────────────────────────────────────────
  audit-svc:
    build:
      context: .
      dockerfile: services/audit-svc/Dockerfile
    container_name: banking-audit-svc
    restart: unless-stopped
    networks:
      - banking-net
      - datasource_datasource_net
    depends_on:
      auth-svc:
        condition: service_started
    env_file:
      - services/audit-svc/.env
    environment:
      DB_HOST: ds_postgres
      NATS_URL: nats://platform-nats:4222
      OTEL_EXPORTER_OTLP_ENDPOINT: banking-jaeger:4317
    ports:
      - "8083:8083"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/healthz/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
